<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Emulator workflow schematic</title>
  <desc id="desc">Simple schematic showing numerical models, training, emulator, and fast predictions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b2b2b"/>
    </marker>
    <style>
      .title { font: 700 34px 'DejaVu Sans', Arial, sans-serif; fill: #182028; }
      .label { font: 700 22px 'DejaVu Sans', Arial, sans-serif; fill: #182028; }
      .body  { font: 400 18px 'DejaVu Sans', Arial, sans-serif; fill: #334155; }
      .small { font: 400 16px 'DejaVu Sans', Arial, sans-serif; fill: #475569; }
      .box   { stroke: #182028; stroke-width: 2.5; rx: 24; ry: 24; }
      .arrow { stroke: #2b2b2b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="700" fill="#fbfaf5"/>

  <text x="700" y="72" text-anchor="middle" class="title">How the Emulator Works</text>

  <rect x="80" y="170" width="260" height="210" class="box" fill="#dbeafe"/>
  <text x="210" y="218" text-anchor="middle" class="label">Numerical Models</text>
  <text x="210" y="260" text-anchor="middle" class="body">Run many full</text>
  <text x="210" y="288" text-anchor="middle" class="body">subduction simulations</text>
  <text x="210" y="334" text-anchor="middle" class="small">About 400-500 model realizations</text>
  <text x="210" y="360" text-anchor="middle" class="small">per suite; inputs: slab age, overriding-plate age,</text>
  <text x="210" y="384" text-anchor="middle" class="small">convergence rate, dip angle, mantle viscosity</text>

  <rect x="420" y="170" width="260" height="210" class="box" fill="#fef3c7"/>
  <text x="550" y="218" text-anchor="middle" class="label">Training Data</text>
  <text x="550" y="260" text-anchor="middle" class="body">Extract targets from</text>
  <text x="550" y="288" text-anchor="middle" class="body">model outputs</text>
  <text x="550" y="334" text-anchor="middle" class="small">Typical split:</text>
  <text x="550" y="360" text-anchor="middle" class="small">332 train / 59 val (const-vc)</text>
  <text x="550" y="384" text-anchor="middle" class="small">423 train / 75 val (ramped-vc)</text>

  <rect x="760" y="140" width="280" height="270" class="box" fill="#d1fae5"/>
  <text x="900" y="188" text-anchor="middle" class="label">Emulator</text>
  <text x="900" y="230" text-anchor="middle" class="body">Train GP / PCA-GP model</text>
  <text x="900" y="270" text-anchor="middle" class="body">to learn the mapping</text>
  <text x="900" y="312" text-anchor="middle" class="small">parameters  →  thermal state</text>
  <text x="900" y="358" text-anchor="middle" class="small">minutes to train,</text>
  <text x="900" y="384" text-anchor="middle" class="small">milliseconds to query</text>

  <rect x="1120" y="120" width="220" height="150" class="box" fill="#fde2e4"/>
  <text x="1230" y="168" text-anchor="middle" class="label">Fast Prediction</text>
  <text x="1230" y="208" text-anchor="middle" class="body">new parameter set</text>
  <text x="1230" y="236" text-anchor="middle" class="body">→ instant output</text>

  <rect x="1120" y="305" width="220" height="125" class="box" fill="#e9d5ff"/>
  <text x="1230" y="352" text-anchor="middle" class="label">Sensitivity</text>
  <text x="1230" y="390" text-anchor="middle" class="body">scan broad parameter</text>
  <text x="1230" y="418" text-anchor="middle" class="body">space cheaply</text>

  <rect x="1120" y="465" width="220" height="125" class="box" fill="#ffe4bf"/>
  <text x="1230" y="512" text-anchor="middle" class="label">P-T-t Paths</text>
  <text x="1230" y="550" text-anchor="middle" class="body">build burial /</text>
  <text x="1230" y="578" text-anchor="middle" class="body">exhumation scenarios</text>

  <path d="M 340 275 L 420 275" class="arrow"/>
  <path d="M 680 275 L 760 275" class="arrow"/>
  <path d="M 1040 195 L 1120 195" class="arrow"/>
  <path d="M 1040 367 L 1120 367" class="arrow"/>
  <path d="M 1040 410 C 1095 430, 1095 505, 1120 527" class="arrow"/>
</svg>
