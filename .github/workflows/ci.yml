name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  quality-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: quality-gate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      CI_DATASETS: 10km_dTdt,80km_dTdt
      CI_SUITES: const-vc,ramped-vc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Train GP subset (const-vc)
        run: python train.py --config configs/gp.const-vc.yaml --datasets "${CI_DATASETS}"
      - name: Train GP subset (ramped-vc)
        run: python train.py --config configs/gp.ramped-vc.yaml --datasets "${CI_DATASETS}"
      - name: Validate quality gate (gp_m25)
        run: make quality-check-gp-m25 QUALITY_SUITES="${CI_SUITES}" QUALITY_DATASETS="${CI_DATASETS}"
