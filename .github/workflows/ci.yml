name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  quality-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: quality-gate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      CI_DATASETS: 40km_dTdt
      CI_SUITES: const-vc,ramped-vc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Train GP subset (const-vc)
        run: python train.py --config configs/gp.const-vc.yaml --datasets "${CI_DATASETS}"
      - name: Train GP subset (ramped-vc)
        run: python train.py --config configs/gp.ramped-vc.yaml --datasets "${CI_DATASETS}"
      - name: Validate quality gate (gp_m25)
        run: make quality-check-gp-m25 QUALITY_SUITES="${CI_SUITES}" QUALITY_DATASETS="${CI_DATASETS}"

  profile-pca-quality-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: profile-pca-quality-gate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      CI_PROFILE_SUITES: const-vc ramped-vc
      CI_PROFILE_TIME: 3
      CI_PROFILE_K: 8
      CI_PROFILE_DATASET: profileT_pca_t3Myr_k8
      CI_PROFILE_DATASETS_FILTER: profileT_pca_t3Myr_k8
      CI_PROFILE_SUITES_FILTER: const-vc,ramped-vc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Build profile-PCA dataset subset
        run: make profile-pca-preprocess PROFILE_SUITES="${CI_PROFILE_SUITES}" PROFILE_TIMES="${CI_PROFILE_TIME}" PROFILE_K="${CI_PROFILE_K}"
      - name: Train profile-PCA GP subset
        run: make profile-pca-train-gp PROFILE_SUITES="${CI_PROFILE_SUITES}" PROFILE_TIMES="${CI_PROFILE_TIME}" PROFILE_K="${CI_PROFILE_K}"
      - name: Write profile-PCA quality reports
        run: make profile-pca-quality-report PROFILE_SUITES="${CI_PROFILE_SUITES}" PROFILE_TIMES="${CI_PROFILE_TIME}" PROFILE_K="${CI_PROFILE_K}"
      - name: Validate profile-PCA quality gate (gp_m25)
        run: make profile-pca-quality-check-gp-m25 QUALITY_SUITES="${CI_PROFILE_SUITES_FILTER}" QUALITY_DATASETS="${CI_PROFILE_DATASETS_FILTER}"
